<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花火 管理画面</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171820;color:#fff;font-family:"Hiragino Sans","Yu Gothic",sans-serif;padding:20px 16px 60px}main{max-width:760px;margin:auto}h1{font-size:22px;margin:0}.sub{font-size:13px;opacity:.65;margin:5px 0 20px}.prob{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}.prob .rareCell{background:#3b3323;box-shadow:inset 0 0 0 1px rgba(255,213,79,.45)}.prob div{padding:10px;text-align:center;background:#292b38;border-radius:10px;font-size:13px}.prob b{display:block;font-size:17px;color:#ffe27a}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar button{padding:11px 13px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.test{min-width:52px}.test.rareBtn{background:#8a6b1f}.test{background:#3949ab;color:#fff}.reset{background:#9e3d3d;color:#fff}.title{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-weight:bold;border-bottom:1px solid #383a47;padding-bottom:8px}.badge{font-size:12px;background:#343644;padding:3px 9px;border-radius:99px}.list{display:flex;flex-direction:column;gap:8px}.item{display:flex;gap:10px;align-items:center;background:#272934;border-radius:13px;padding:12px}.swatch{width:11px;height:44px;border-radius:4px}.info{flex:1;min-width:0}.message{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.name{font-size:12px;opacity:.62;margin-top:3px}.actions{display:flex;gap:6px}.actions button{border:0;border-radius:8px;padding:8px 10px;cursor:pointer}.launch{background:linear-gradient(135deg,#ffca28,#ff7043);color:#302000;font-weight:bold}.del{background:#a33;color:#fff}.back{background:#357a38;color:#fff}.empty{text-align:center;padding:28px;opacity:.45}.result{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#111827;border:1px solid #586075;border-radius:13px;padding:13px 20px;display:none;z-index:10}.result.show{display:block}.rare{color:#ffd54f;font-weight:bold}
</style></head><body><main><h1>🎆 花火 管理画面</h1><div class="sub">花火玉を選んで打ち上げます。抽選結果はOBS画面へ送信されます。動画は A〜J の10種類・各10%、H・I・J がレアです。</div>
<div class="prob" id="probBox"></div>
<div class="toolbar" id="testBar"></div>
<div class="toolbar"><button class="reset" id="resetAll">全データ削除</button></div>
<div class="title">待機中の花火玉 <span class="badge" id="entryCount">0件</span></div><div class="list" id="entries"></div>
<div class="title">打ち上げ履歴 <span class="badge" id="historyCount">0件</span></div><div class="list" id="history"></div></main><div class="result" id="result"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,onValue,push,set,remove,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDKwFPNTgPJawD47WxuDsJH2-V1E3zWqoU",authDomain:"utaoshi-ringo.firebaseapp.com",databaseURL:"https://utaoshi-ringo-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"utaoshi-ringo",storageBucket:"utaoshi-ringo.firebasestorage.app",messagingSenderId:"572385012765",appId:"1:572385012765:web:2f5542f69930f1a714eaf4"};
const db=getDatabase(initializeApp(firebaseConfig));let locked=false;
// 動画は A〜J の10種類、各10%。レア演出は H・I・J
const TYPES=["A","B","C","D","E","F","G","H","I","J"];const RARE_TYPES=["H","I","J"];const isRare=t=>RARE_TYPES.includes(String(t||"").toUpperCase());
const probBox=document.getElementById("probBox");TYPES.forEach(t=>{const d=document.createElement("div");d.innerHTML=`${t}<b>10%</b>`;if(isRare(t))d.className="rareCell";probBox.appendChild(d)});
const testBar=document.getElementById("testBar");TYPES.forEach(t=>{const b=document.createElement("button");b.className="test"+(isRare(t)?" rareBtn":"");b.textContent=t;b.onclick=()=>sendLaunch(t);testBar.appendChild(b)});
function drawType(){return TYPES[Math.floor(Math.random()*TYPES.length)]}
function flash(text,rare=false){const el=document.getElementById("result");el.innerHTML=rare?`抽選結果：<span class="rare">${text}</span>`:`抽選結果：${text}`;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2500)}
async function sendLaunch(type,item={name:"テスト",message:`動画${type}の再生テスト`,color:"#ffd54f"}){await set(ref(db,"fireworks/currentLaunch"),{...item,type,nonce:crypto.randomUUID?.()||String(Date.now())+Math.random(),launchedAt:serverTimestamp()});flash(isRare(type)?`${type}動画（レア）`:`${type}動画`,isRare(type))}
async function launch(item){if(locked)return;locked=true;try{const type=drawType();await sendLaunch(type,item);await push(ref(db,"fireworks/history"),{...item,type,launchedAt:serverTimestamp()});await remove(ref(db,`fireworks/entries/${item.id}`))}finally{setTimeout(()=>locked=false,700)}}
function renderList(snapshot,targetId,countId,history=false){const data=snapshot.val()||{};const items=Object.entries(data).map(([id,v])=>({id,...v})).sort((a,b)=>(b.createdAt||b.launchedAt||0)-(a.createdAt||a.launchedAt||0));document.getElementById(countId).textContent=items.length+"件";const box=document.getElementById(targetId);box.innerHTML="";if(!items.length){box.innerHTML='<div class="empty">まだありません</div>';return}items.forEach(item=>{const el=document.createElement("div");el.className="item";el.innerHTML=`<div class="swatch" style="background:${item.color||'#fff'}"></div><div class="info"><div class="message">${escapeHtml(item.message||'')}</div><div class="name">${escapeHtml(item.name||'名無し')}${history?` ／ 動画${item.type}`:""}</div></div><div class="actions">${history?'<button class="back">戻す</button>':'<button class="launch">🚀 打上げ</button>'}<button class="del">削除</button></div>`;if(history)el.querySelector(".back").onclick=async()=>{await push(ref(db,"fireworks/entries"),{name:item.name,message:item.message,color:item.color,createdAt:serverTimestamp()});await remove(ref(db,`fireworks/history/${item.id}`))};else el.querySelector(".launch").onclick=()=>launch(item);el.querySelector(".del").onclick=()=>confirm("削除しますか？")&&remove(ref(db,`fireworks/${history?'history':'entries'}/${item.id}`));box.appendChild(el)})}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
onValue(ref(db,"fireworks/entries"),s=>renderList(s,"entries","entryCount"));onValue(ref(db,"fireworks/history"),s=>renderList(s,"history","historyCount",true));
document.getElementById("resetAll").onclick=async()=>{if(confirm("花火システムの待機データ・履歴・現在の演出をすべて削除しますか？"))await remove(ref(db,"fireworks"))};
</script></body></html>
