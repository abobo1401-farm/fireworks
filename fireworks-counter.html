<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>花火カウンター</title>
<style>
/* ===== 基本（OBS用に背景は透過） ===== */
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;
  font-family:"Hiragino Sans","Yu Gothic",sans-serif;color:#fff;user-select:none}
body.debug{background:repeating-conic-gradient(#2a2c38 0 25%,#22242e 0 50%) 0 0/40px 40px}

#wrap{position:fixed;inset:0;display:flex;padding:14px}
#wrap.h-left{justify-content:flex-start}#wrap.h-center{justify-content:center}#wrap.h-right{justify-content:flex-end}
#wrap.v-top{align-items:flex-start}#wrap.v-middle{align-items:center}#wrap.v-bottom{align-items:flex-end}

/* ===== カウンター本体 ===== */
#panel{position:relative;text-align:center;transition:transform .18s ease}
#panel.boxed{padding:18px 26px 16px;border-radius:22px;
  background:linear-gradient(160deg,rgba(20,26,58,.82),rgba(6,9,24,.88));
  border:2px solid rgba(255,215,120,.42);
  box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 26px rgba(255,180,60,.14)}
#panel.boxed.numOnly{padding:calc(14px * var(--s)) calc(20px * var(--s))}
#panel.pop{animation:panelPop .45s ease}
@keyframes panelPop{0%{transform:scale(1)}30%{transform:scale(1.07)}100%{transform:scale(1)}}
#panel.rarePop{animation:panelPop .45s ease,rareGlow 1.1s ease}
@keyframes rareGlow{0%{filter:drop-shadow(0 0 0 rgba(255,213,79,0))}25%{filter:drop-shadow(0 0 26px rgba(255,213,79,.95))}100%{filter:drop-shadow(0 0 0 rgba(255,213,79,0))}}

.label{font-size:calc(22px * var(--s));font-weight:bold;letter-spacing:.08em;
  color:#ffe9a8;text-shadow:0 2px 6px #000,0 0 12px rgba(255,170,60,.5);margin-bottom:calc(8px * var(--s))}

.countRow{display:flex;align-items:flex-end;justify-content:center;gap:calc(8px * var(--s))}
.digits{display:flex;gap:calc(6px * var(--s))}
.digits.flatSet{gap:calc(1px * var(--s))}
.digit{position:relative;display:flex;align-items:center;justify-content:center;
  width:calc(58px * var(--s));height:calc(84px * var(--s));border-radius:calc(12px * var(--s));
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.34));
  box-shadow:inset 0 0 0 2px rgba(255,215,120,.35),0 6px 14px rgba(0,0,0,.45);
  font-size:calc(62px * var(--s));font-weight:900;line-height:1;
  background-clip:padding-box}
.digit.flat{background:none;box-shadow:none;width:calc(40px * var(--s));height:calc(78px * var(--s))}
.digit span{background:linear-gradient(180deg,#fff8dc 0%,#ffd54f 48%,#ff9d3c 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.75))}
.digit.bump{animation:digitBump .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes digitBump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(calc(-9px * var(--s))) scale(1.18)}100%{transform:translateY(0) scale(1)}}
.unit{font-size:calc(30px * var(--s));font-weight:bold;color:#ffe9a8;
  text-shadow:0 2px 6px #000;padding-bottom:calc(6px * var(--s))}

.rare{margin-top:calc(9px * var(--s));font-size:calc(19px * var(--s));color:#ffd54f;
  text-shadow:0 2px 6px #000}
.rare b{font-size:calc(25px * var(--s))}
.types{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(5px * var(--s));margin-top:calc(11px * var(--s))}
.chip{font-size:calc(14px * var(--s));padding:calc(4px * var(--s)) calc(9px * var(--s));border-radius:999px;
  background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);text-shadow:0 1px 3px #000}
.chip.rareChip{background:rgba(255,213,79,.18);box-shadow:inset 0 0 0 1px rgba(255,213,79,.55);color:#ffe9a8}
.chip b{margin-left:calc(4px * var(--s))}
.hidden{display:none !important}

/* ===== 打ち上げ時のキラキラ ===== */
#spark{position:absolute;inset:-40px;pointer-events:none;overflow:visible}
.sp{position:absolute;left:50%;top:38%;width:8px;height:8px;border-radius:50%;
  background:#ffe27a;box-shadow:0 0 10px #ffca28;animation:spFly .85s ease-out forwards}
@keyframes spFly{0%{transform:translate(-50%,-50%) scale(1);opacity:1}
100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}

/* ===== 管理バー（?admin=1 のときだけ表示） ===== */
#adminBar{position:fixed;left:0;right:0;bottom:0;display:none;gap:8px;flex-wrap:wrap;
  justify-content:center;padding:12px;background:rgba(10,12,24,.9);border-top:1px solid #3a3d4c}
#adminBar.show{display:flex}
#adminBar button{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:bold;cursor:pointer;color:#fff}
.b-plus{background:#2e7d32}.b-minus{background:#4a4d5e}.b-reset{background:#9e3d3d}.b-rare{background:#8a6b1f}
#adminMsg{align-self:center;font-size:12px;opacity:.7}
#status{position:fixed;left:12px;top:12px;font-size:13px;padding:6px 10px;border-radius:8px;
  background:rgba(0,0,0,.5);display:none}
#status.show{display:block}#status.err{color:#ff9d9d}
</style>
</head>
<body>
<div id="wrap">
  <div id="panel">
    <div class="label" id="labelText">🎆 打ち上げ数</div>
    <div class="countRow">
      <div class="digits" id="digits"></div>
      <span class="unit" id="unitText">発</span>
    </div>
    <div class="rare hidden" id="rareLine">レア <b id="rareCount">0</b> 発</div>
    <div class="types hidden" id="typeLine"></div>
    <div id="spark"></div>
  </div>
</div>
<div id="adminBar">
  <button class="b-plus" id="btnPlus">手動 +1</button>
  <button class="b-minus" id="btnMinus">−1</button>
  <button class="b-reset" id="btnReset">0にリセット</button>
  <span id="adminMsg"></span>
</div>
<div id="status">接続中…</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,onValue,runTransaction}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDKwFPNTgPJawD47WxuDsJH2-V1E3zWqoU",authDomain:"utaoshi-ringo.firebaseapp.com",databaseURL:"https://utaoshi-ringo-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"utaoshi-ringo",storageBucket:"utaoshi-ringo.firebasestorage.app",messagingSenderId:"572385012765",appId:"1:572385012765:web:2f5542f69930f1a714eaf4"};
const db=getDatabase(initializeApp(firebaseConfig));

/* 動画は A〜J の10種類。レア演出は H・I・J（表示側・管理画面と同じ定義） */
const TYPES=["A","B","C","D","E","F","G","H","I","J"];
const RARE_TYPES=["H","I","J"];
const isRare=t=>RARE_TYPES.includes(String(t||"").toUpperCase());

/* ===== URLパラメータ ===== */
const P=new URLSearchParams(location.search);
const bool=(k,d)=>P.has(k)?!["0","false","off","no"].includes((P.get(k)||"1").toLowerCase()):d;
const numP=(k,d)=>{const v=parseFloat(P.get(k));return isFinite(v)?v:d};
const SCALE=Math.min(4,Math.max(.3,numP("scale",1)));
const MIN_DIGITS=Math.min(6,Math.max(1,Math.round(numP("digits",2))));
/* 既定は「枠つきの数字だけ」。ラベルや単位が要るときだけ ?label= ?unit= を付けます */
const SHOW_RARE=bool("rare",false);
const SHOW_TYPES=bool("types",false);
const BOXED=bool("panel",true);
const DIGIT_BOX=bool("box",false);
const SE=bool("se",false);
const ADMIN=bool("admin",false);
const DEBUG=bool("debug",false);
document.documentElement.style.setProperty("--s",SCALE);
document.getElementById("labelText").textContent=P.get("label")??"";
document.getElementById("unitText").textContent=P.get("unit")??"";
if(!document.getElementById("labelText").textContent)document.getElementById("labelText").classList.add("hidden");
if(!document.getElementById("unitText").textContent)document.getElementById("unitText").classList.add("hidden");
const wrap=document.getElementById("wrap");
wrap.classList.add("h-"+({left:"left",center:"center",right:"right"}[P.get("align")]||"center"));
wrap.classList.add("v-"+({top:"top",middle:"middle",bottom:"bottom"}[P.get("valign")]||"middle"));
const panel=document.getElementById("panel");
if(BOXED)panel.classList.add("boxed");
if(SHOW_RARE)document.getElementById("rareLine").classList.remove("hidden");
if(SHOW_TYPES)document.getElementById("typeLine").classList.remove("hidden");
if(!document.getElementById("labelText").textContent&&!document.getElementById("unitText").textContent&&!SHOW_RARE&&!SHOW_TYPES)panel.classList.add("numOnly");
if(DEBUG){document.body.classList.add("debug");document.getElementById("status").classList.add("show")}
if(ADMIN)document.getElementById("adminBar").classList.add("show");
const setStatus=(t,err=false)=>{const s=document.getElementById("status");s.textContent=t;s.className=(DEBUG?"show":"")+(err?" err":"")};

/* ===== 表示 ===== */
const digitsBox=document.getElementById("digits");
let shown={total:null,rare:0,types:{}};
function renderDigits(total,bump){
  const str=String(Math.max(0,total)).padStart(MIN_DIGITS,"0");
  const prev=String(Math.max(0,shown.total??total)).padStart(MIN_DIGITS,"0");
  if(digitsBox.children.length!==str.length){
    // 桁が増減したときは作り直し（99→100 など）。増えたときは全桁を跳ねさせます
    digitsBox.innerHTML="";
    digitsBox.classList.toggle("flatSet",!DIGIT_BOX);
    for(const ch of str){const d=document.createElement("div");d.className="digit"+(DIGIT_BOX?"":" flat");
      d.innerHTML=`<span>${ch}</span>`;digitsBox.appendChild(d);
      if(bump){void d.offsetWidth;d.classList.add("bump")}}
  }else{
    [...str].forEach((ch,i)=>{
      const cell=digitsBox.children[i],sp=cell.firstElementChild;
      if(sp.textContent!==ch){sp.textContent=ch;
        if(bump){cell.classList.remove("bump");void cell.offsetWidth;cell.classList.add("bump")}}
    });
  }
}
function renderTypes(types){
  if(!SHOW_TYPES)return;
  const box=document.getElementById("typeLine");box.innerHTML="";
  TYPES.forEach(t=>{const n=Number(types?.[t])||0;
    const el=document.createElement("span");el.className="chip"+(isRare(t)?" rareChip":"");
    el.innerHTML=`${t}<b>${n}</b>`;box.appendChild(el)});
}
function sparkle(rare){
  const box=document.getElementById("spark");
  const n=rare?18:10;
  for(let i=0;i<n;i++){
    const s=document.createElement("div");s.className="sp";
    const a=Math.random()*Math.PI*2,r=(60+Math.random()*110)*SCALE;
    s.style.setProperty("--dx",Math.cos(a)*r+"px");
    s.style.setProperty("--dy",Math.sin(a)*r+"px");
    if(rare)s.style.background="#fff3c4";
    s.style.animationDelay=(Math.random()*.12)+"s";
    box.appendChild(s);setTimeout(()=>s.remove(),1000);
  }
}
function celebrate(rare){
  panel.classList.remove("pop","rarePop");void panel.offsetWidth;
  panel.classList.add(rare?"rarePop":"pop");
  sparkle(rare);playSe(rare);
}

/* ===== 効果音（?se=1 のときだけ／Web Audioで合成） ===== */
let ac=null;
function primeAudio(){if(!SE)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}}
addEventListener("click",primeAudio,{once:true});addEventListener("keydown",primeAudio,{once:true});
setTimeout(primeAudio,300);
function playSe(rare){
  if(!SE)return;primeAudio();if(!ac)return;
  const t0=ac.currentTime;
  const beep=(freq,at,dur,type="triangle",gain=.18)=>{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t0+at);
    g.gain.setValueAtTime(0,t0+at);g.gain.linearRampToValueAtTime(gain,t0+at+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t0+at+dur);
    o.connect(g);g.connect(ac.destination);o.start(t0+at);o.stop(t0+at+dur+.05);
  };
  if(rare){[880,1174,1568,2093].forEach((f,i)=>beep(f,i*.075,.3))}
  else{beep(988,0,.18);beep(1318,.07,.22)}
}

/* ===== カウンターの読み込み ===== */
onValue(ref(db,"fireworks/counter"),snap=>{
  const v=snap.val()||{};
  const total=Number(v.total)||0,rare=Number(v.rare)||0,types=v.types||{};
  const first=shown.total===null;
  const up=!first&&total>shown.total;
  const rareUp=!first&&rare>shown.rare;
  renderDigits(total,up);
  document.getElementById("rareCount").textContent=rare;
  renderTypes(types);
  shown={total,rare,types};
  if(up)celebrate(rareUp);
  setStatus(`接続済み ${total}発`);
},e=>{console.error(e);setStatus("Firebaseの読み込みに失敗",true)});

/* ===== 打ち上げの検知 =====
   fireworks/currentLaunch の nonce が変わったら +1。
   nonce をカウンター側にも保存してトランザクションで判定するので、
   このページを何枚開いていても二重カウントにはなりません。 */
let firstSnap=true;
onValue(ref(db,"fireworks/currentLaunch"),snap=>{
  const d=snap.val();
  if(!d||!d.nonce)return;
  const seedOnly=firstSnap;firstSnap=false;
  runTransaction(ref(db,"fireworks/counter"),cur=>{
    cur=cur||{total:0,lastNonce:""};
    if(cur.lastNonce===d.nonce)return;              // カウント済み → 中止
    if(seedOnly){cur.lastNonce=d.nonce;return cur}  // 起動直後の古い演出はカウントしない
    cur.total=(Number(cur.total)||0)+1;             // 種類に関係なく1発として数えます
    cur.lastNonce=d.nonce;
    return cur;
  }).catch(e=>{console.error(e);setStatus("カウントの書き込みに失敗",true)});
},e=>console.error(e));

/* ===== 手動操作（?admin=1） ===== */
const adminMsg=document.getElementById("adminMsg");
const flashMsg=t=>{adminMsg.textContent=t;setTimeout(()=>adminMsg.textContent="",2000)};
const bump=dTotal=>runTransaction(ref(db,"fireworks/counter"),cur=>{
  cur=cur||{total:0,lastNonce:""};
  cur.total=Math.max(0,(Number(cur.total)||0)+dTotal);
  return cur;
});
document.getElementById("btnPlus").onclick=()=>bump(1).then(()=>flashMsg("+1しました"));
document.getElementById("btnMinus").onclick=()=>bump(-1).then(()=>flashMsg("−1しました"));
document.getElementById("btnReset").onclick=()=>{
  if(!confirm("カウントを0に戻しますか？（花火玉・履歴には触れません）"))return;
  runTransaction(ref(db,"fireworks/counter"),cur=>({total:0,lastNonce:(cur&&cur.lastNonce)||""}))
    .then(()=>flashMsg("リセットしました"));
};
renderDigits(0,false);renderTypes({});
</script>
</body>
</html>
