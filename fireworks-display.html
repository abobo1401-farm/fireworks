<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>花火 OBS表示</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Hiragino Sans","Yu Gothic",sans-serif}#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:transparent}#video.show{display:block}#caption{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);width:min(90%,1000px);text-align:center;color:#fff;display:none;text-shadow:0 3px 10px #000,0 0 18px #000;z-index:2}#caption.show{display:block;animation:pop .5s ease}.message{font-size:clamp(28px,4vw,58px);font-weight:bold}.name{font-size:clamp(20px,2.7vw,38px);margin-top:12px;color:#ffe59a}.type{position:fixed;top:5%;right:5%;font-size:clamp(22px,3vw,44px);font-weight:bold;color:#fff;display:none;text-shadow:0 2px 10px #000;z-index:3}.type.show{display:block}.type.rare{color:#ffd54f;animation:pulse .65s infinite alternate}@keyframes pop{from{opacity:0;transform:translate(-50%,30px) scale(.85)}to{opacity:1;transform:translate(-50%,0) scale(1)}}@keyframes pulse{to{transform:scale(1.12);filter:drop-shadow(0 0 16px #ffd54f)}}
</style></head><body><video id="video" playsinline preload="auto"></video><div id="type" class="type"></div><div id="caption"><div class="message" id="message"></div><div class="name" id="name"></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDKwFPNTgPJawD47WxuDsJH2-V1E3zWqoU",authDomain:"utaoshi-ringo.firebaseapp.com",databaseURL:"https://utaoshi-ringo-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"utaoshi-ringo",storageBucket:"utaoshi-ringo.firebasestorage.app",messagingSenderId:"572385012765",appId:"1:572385012765:web:2f5542f69930f1a714eaf4"};
const db=getDatabase(initializeApp(firebaseConfig));const files={A:"videos/firework-a.mp4",B:"videos/firework-b.mp4",C:"videos/firework-c.mp4",D:"videos/firework-d.mp4"};let initialized=false,lastNonce="",playing=false,queued=null;
function safe(s){return String(s||"")}
async function playLaunch(data){if(!data?.type||!files[data.type])return;if(playing){queued=data;return}playing=true;const video=document.getElementById("video"),caption=document.getElementById("caption"),type=document.getElementById("type");document.getElementById("message").textContent=safe(data.message);document.getElementById("name").textContent=`${safe(data.name||"名無し")} さんの花火`;type.textContent=data.type==="D"?"✨ レア花火 D ✨":`花火 ${data.type}`;type.className="type show"+(data.type==="D"?" rare":"");caption.classList.add("show");video.src=files[data.type];video.currentTime=0;video.classList.add("show");try{await video.play()}catch(e){console.error("動画を再生できません",e);finish()}video.onended=finish;video.onerror=()=>{console.error("動画ファイルが見つかりません:",video.src);finish()};function finish(){video.pause();video.classList.remove("show");caption.classList.remove("show");type.className="type";playing=false;if(queued){const next=queued;queued=null;setTimeout(()=>playLaunch(next),300)}}}
onValue(ref(db,"fireworks/currentLaunch"),snap=>{const data=snap.val();if(!initialized){initialized=true;lastNonce=data?.nonce||"";return}if(!data?.nonce||data.nonce===lastNonce)return;lastNonce=data.nonce;playLaunch(data)});
</script></body></html>
