<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>花火玉ディスプレイ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Hiragino Sans","Yu Gothic",sans-serif;color:#fff}
#stage{position:fixed;inset:0;overflow:hidden}
#ballLayer{position:absolute;inset:0;z-index:5}
#miniLayer{position:absolute;inset:0;z-index:3;pointer-events:none}
.firework-ball{position:absolute;width:var(--size,112px);height:var(--size,112px);border-radius:50%;cursor:pointer;transform-origin:center;animation:floatBall var(--duration,4s) ease-in-out infinite;filter:drop-shadow(0 9px 10px rgba(0,0,0,.45));user-select:none}
.firework-ball::before{content:"";position:absolute;inset:8%;border:4px solid rgba(255,255,255,.45);border-radius:50%;box-shadow:inset 0 0 20px rgba(255,255,255,.22)}
.firework-ball::after{content:"";position:absolute;width:5px;height:23%;bottom:-19%;left:48%;background:linear-gradient(#d8c08b,#7f6033);border-radius:4px;transform:rotate(var(--fuse,8deg));transform-origin:top}
.mini{position:absolute;width:var(--size,64px);height:var(--size,64px);animation:miniFloat 6.5s ease-in-out infinite}
.mini .burst{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from var(--rot,0deg),var(--c,#ffd54f) 0deg 1.5deg,transparent 1.5deg 15deg);-webkit-mask-image:radial-gradient(circle,#fff 0 6%,rgba(255,255,255,.85) 26%,transparent 70%);mask-image:radial-gradient(circle,#fff 0 6%,rgba(255,255,255,.85) 26%,transparent 70%);animation:twinkle var(--tw,3s) ease-in-out infinite alternate}
.mini .core{position:absolute;left:50%;top:50%;width:15%;height:15%;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 0 10px var(--c,#ffd54f),0 0 22px var(--c,#ffd54f)}
.mini .mini-name{position:absolute;top:94%;left:50%;transform:translateX(-50%);font-size:13px;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.92);text-shadow:0 2px 5px #000,0 0 8px #000}
@keyframes miniFloat{0%,100%{transform:translateY(-3px)}50%{transform:translateY(4px)}}
@keyframes twinkle{from{opacity:.55;transform:scale(.92)}to{opacity:1;transform:scale(1.06)}}
@keyframes floatBall{0%,100%{transform:translateY(-6px) rotate(-2deg)}50%{transform:translateY(9px) rotate(2deg)}}

#popup{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.58);padding:30px}
#popup.show{display:flex}.popup-card{width:min(800px,92vw);padding:38px;border-radius:28px;background:linear-gradient(145deg,rgba(28,34,66,.97),rgba(12,15,34,.98));border:2px solid rgba(255,220,120,.5);box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 32px rgba(255,190,60,.18);text-align:center;animation:popIn .28s ease}
@keyframes popIn{from{opacity:0;transform:scale(.78)}to{opacity:1;transform:scale(1)}}
.popup-ball{width:150px;height:150px;border-radius:50%;margin:0 auto 25px;display:flex;align-items:center;justify-content:center;font-size:64px;position:relative;filter:drop-shadow(0 10px 12px rgba(0,0,0,.5))}.popup-ball::before{content:"";position:absolute;inset:10px;border:5px solid rgba(255,255,255,.45);border-radius:50%}
.popup-message{font-size:clamp(28px,4vw,48px);line-height:1.5;font-weight:bold;word-break:break-word}.popup-name{font-size:clamp(22px,3vw,34px);margin-top:18px;color:#ffe59a;min-height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}.popup-name .name-real{opacity:0;transition:opacity .35s ease}.popup-name.revealed .name-real{opacity:1}.popup-name .name-placeholder{position:absolute;font-size:18px;color:rgba(255,255,255,.65);text-decoration:underline dotted}.popup-name.revealed .name-placeholder{display:none}
#launchBtn{width:100%;border:0;border-radius:18px;padding:17px;margin-top:22px;font-size:24px;font-weight:bold;cursor:pointer;background:linear-gradient(135deg,#ffd54f,#ff7043);color:#321b00;box-shadow:0 6px 20px rgba(255,120,30,.35)}#launchBtn:disabled{opacity:.5;cursor:not-allowed}

#launchBall{position:fixed;width:130px;height:130px;border-radius:50%;z-index:180;display:none;align-items:center;justify-content:center;font-size:54px;filter:drop-shadow(0 8px 12px #000);pointer-events:none}#launchBall.fly{display:flex;animation:launchFly 1.35s cubic-bezier(.25,.8,.35,1) forwards}@keyframes launchFly{0%{left:50%;top:68%;transform:translate(-50%,-50%) scale(1);opacity:1}75%{left:50%;top:14%;transform:translate(-50%,-50%) scale(.68);opacity:1}100%{left:50%;top:-10%;transform:translate(-50%,-50%) scale(.35);opacity:0}}
#flash{position:fixed;inset:0;z-index:185;background:#fff;opacity:0;pointer-events:none}#flash.show{animation:flash .55s ease}@keyframes flash{0%{opacity:0}30%{opacity:.92}100%{opacity:0}}

#backdrop{position:fixed;inset:0;z-index:198;display:none;background:radial-gradient(ellipse at 50% 45%,rgba(10,14,34,.62) 0,rgba(3,5,14,.86) 70%,rgba(0,0,0,.92) 100%)}#backdrop.show{display:block;animation:fadeIn .4s ease}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#videoWrap{position:fixed;inset:0;z-index:200;display:none}#videoWrap.show{display:block;animation:fadeIn .25s ease}
#video{width:100%;height:100%;object-fit:cover;display:block;background:#000}

#fallback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:210;background:rgba(0,0,0,.75);text-align:center;padding:40px}#fallback.show{display:flex}.fallback-main{font-size:clamp(30px,5vw,62px);font-weight:bold}.fallback-sub{font-size:clamp(18px,2.5vw,32px);margin-top:18px;color:#ffe59a}
#halfLine{position:fixed;left:0;right:0;top:50%;height:2px;background:rgba(255,90,90,.75);z-index:299;display:none}
#status{position:fixed;left:16px;bottom:16px;z-index:300;padding:7px 11px;border-radius:9px;background:rgba(0,0,0,.48);font-size:15px;opacity:.8;display:none}#status.ready{color:#9dffb0}#status.error{color:#ff9d9d}
</style>
</head>
<body>
<div id="stage"><div id="miniLayer"></div><div id="ballLayer"></div></div>
<div id="popup"><div class="popup-card"><div id="popupBall" class="popup-ball"></div><div id="popupMessage" class="popup-message"></div><div id="popupName" class="popup-name"><span class="name-placeholder">名前をタップして表示</span><span class="name-real"></span></div><button id="launchBtn">🚀 この花火玉を打ち上げる</button></div></div>
<div id="launchBall"></div><div id="flash"></div>
<div id="backdrop"></div><div id="videoWrap"><video id="video" playsinline preload="auto"></video></div>
<div id="fallback"><div><div id="fallbackMain" class="fallback-main"></div><div id="fallbackSub" class="fallback-sub"></div></div></div>
<div id="halfLine"></div>
<div id="status">Firebase接続中…</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,onValue,set,push,remove,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDKwFPNTgPJawD47WxuDsJH2-V1E3zWqoU",authDomain:"utaoshi-ringo.firebaseapp.com",databaseURL:"https://utaoshi-ringo-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"utaoshi-ringo",storageBucket:"utaoshi-ringo.firebasestorage.app",messagingSenderId:"572385012765",appId:"1:572385012765:web:2f5542f69930f1a714eaf4"};
const db=getDatabase(initializeApp(firebaseConfig));
// 動画フォルダは起動時に自動判定します（videos/ → 動画/ → video/ → movies/ → 同じ階層 の順に探索）
// 動画は A〜J の10種類、各10%。レア演出は H・I・J
const VERSION="v5 (A〜J / 確率可変 / 文字なし)";
const TYPES=["A","B","C","D","E","F","G","H","I","J"];
const RARE_TYPES=["H","I","J"];
const isRare=t=>RARE_TYPES.includes(String(t||"").toUpperCase());
// 抽選の重みは管理画面から変更でき、Firebase経由でここにも反映されます
let weights=Object.fromEntries(TYPES.map(t=>[t,10]));
const VIDEO_DIRS=["videos/","動画/","video/","movies/",""];
let videoBase="videos/";
// ファイル名は firework-a.mp4 形式で自動生成。種類を増やす時は TYPES に足すだけでOK
const videoUrl=t=>encodeURI(videoBase+"firework-"+String(t||"").toLowerCase()+".mp4");
async function resolveVideoBase(){for(const base of VIDEO_DIRS){try{const r=await fetch(encodeURI(base+"firework-a.mp4"),{method:"HEAD",cache:"no-store"});if(r.ok){videoBase=base;return base}}catch(e){}}return null}
const colors=["#e8534f","#f3b33d","#5fae6a","#5b8fd6","#a07fd6","#e86ca4"];
const layer=document.getElementById("ballLayer"),popup=document.getElementById("popup"),video=document.getElementById("video"),statusEl=document.getElementById("status");
const backdrop=document.getElementById("backdrop"),videoWrap=document.getElementById("videoWrap"),miniLayer=document.getElementById("miniLayer");
// ?debug=1 を付けて開いた時だけ左下に接続状態と中央ガイド線を表示します（OBSでは付けない）
const PARAMS=new URLSearchParams(location.search),DEBUG=PARAMS.has("debug");
if(DEBUG){statusEl.style.display="block";document.getElementById("halfLine").style.display="block"}
// 待機中の花火玉を並べ始める高さ（0.5＝画面中央）。?balltop=0.6 のように変更できます
const BALL_TOP=Math.min(.9,Math.max(.35,parseFloat(PARAMS.get("balltop"))||.55));
// 動画の表示方法：既定は全画面（cover／縦動画は上下がトリミングされます）。?fit=contain で全体表示に切り替え
if(PARAMS.get("fit")==="contain")video.style.objectFit="contain";
function showStage(on){backdrop.classList.toggle("show",on);videoWrap.classList.toggle("show",on)}
let entries=[],launched=[],selected=null,playing=false,queued=null,initialized=false,lastNonce="",launchLock=false;
const safe=s=>String(s??"");
function setStatus(text,cls=""){statusEl.textContent=text;statusEl.className=cls}
function hash(str){let h=0;for(const ch of str)h=(h*31+ch.charCodeAt(0))>>>0;return h}
function drawType(){const tot=TYPES.reduce((a,t)=>a+(Number(weights[t])||0),0);if(tot<=0)return TYPES[Math.floor(Math.random()*TYPES.length)];let r=Math.random()*tot;for(const t of TYPES){r-=Number(weights[t])||0;if(r<0)return t}return TYPES[TYPES.length-1]}
// 待機中の花火玉：画面の下半分に配置（名前・絵文字なし）
function renderBalls(){layer.innerHTML="";const w=Math.max(innerWidth,320),h=Math.max(innerHeight,500);const n=entries.length;if(!n)return;
const size=n>24?74:n>14?92:112;
const top=h*BALL_TOP,bottom=h-size*1.35,bandH=Math.max(90,bottom-top);
const cols=Math.min(Math.max(3,Math.floor((w-30)/(size+34))),n);
const rows=Math.max(1,Math.ceil(n/cols));
const cellW=(w-30)/cols,cellH=bandH/rows;
entries.forEach((item,i)=>{const seed=hash(item.id);const col=i%cols,row=Math.floor(i/cols);
const color=item.color||colors[seed%colors.length];
const x=15+col*cellW+(seed%Math.max(6,Math.floor(cellW-size)));
const y=top+row*cellH+((seed>>8)%Math.max(6,Math.floor(cellH-size)));
const el=document.createElement("div");el.className="firework-ball";
el.style.background=`radial-gradient(circle at 35% 28%,#fff 0 5%,${color} 22%,${color} 58%,#34152c 100%)`;
el.style.left=x+"px";el.style.top=y+"px";el.style.setProperty("--size",size+"px");
el.style.setProperty("--duration",(3.4+(seed%18)/10)+"s");el.style.setProperty("--fuse",((seed%21)-10)+"deg");
el.style.animationDelay=-(seed%3000)+"ms";
el.addEventListener("click",()=>openPopup(item,color));layer.appendChild(el)})}

// 打ち上げ済み：夜空にミニ花火として名前付きで浮かべる（画面の上半分）
function renderMinis(){miniLayer.innerHTML="";const w=Math.max(innerWidth,320),h=Math.max(innerHeight,500);const n=launched.length;if(!n)return;
const size=n>30?46:n>16?58:70;
const top=h*0.05,bandH=Math.max(90,h*0.42-top);
const cols=Math.min(Math.max(3,Math.floor((w-60)/(size+72))),n);
const rows=Math.max(1,Math.ceil(n/cols));
const cellW=(w-60)/cols,cellH=bandH/rows;
launched.forEach((item,i)=>{const seed=hash(item.id);const col=i%cols,row=Math.floor(i/cols);
const color=item.color||colors[seed%colors.length];
const x=30+col*cellW+(seed%Math.max(6,Math.floor(cellW-size)));
const y=top+row*cellH+((seed>>7)%Math.max(6,Math.floor(cellH-size-20)));
const el=document.createElement("div");el.className="mini";
el.style.left=x+"px";el.style.top=y+"px";
el.style.setProperty("--size",size+"px");el.style.setProperty("--c",color);
el.style.setProperty("--rot",(seed%30)+"deg");el.style.setProperty("--tw",(2.4+(seed%22)/10)+"s");
el.style.animationDelay=-(seed%4500)+"ms";
el.innerHTML='<div class="burst"></div><div class="core"></div><div class="mini-name"></div>';
el.querySelector(".mini-name").textContent=safe(item.name||"名無し");
miniLayer.appendChild(el)})}
function openPopup(item,color){if(playing)return;selected=item;const pb=document.getElementById("popupBall");pb.style.background=`radial-gradient(circle at 35% 28%,#fff 0 5%,${color} 22%,${color} 58%,#34152c 100%)`;document.getElementById("popupMessage").textContent=safe(item.message||"メッセージなし");const nameBox=document.getElementById("popupName");nameBox.classList.remove("revealed");nameBox.querySelector(".name-real").textContent=`${safe(item.name||"名無し")} さん`;document.getElementById("launchBtn").disabled=false;popup.classList.add("show")}
function closePopup(){if(launchLock)return;popup.classList.remove("show");selected=null}
document.getElementById("popupName").addEventListener("click",e=>{e.stopPropagation();e.currentTarget.classList.add("revealed")});
popup.addEventListener("click",e=>{if(e.target===popup)closePopup()});
async function sendLaunch(type,item){const data={name:item.name||"名無し",message:item.message||"",color:item.color||"#ffd54f",type,entryId:item.id||"",nonce:crypto.randomUUID?.()||String(Date.now())+Math.random(),launchedAt:serverTimestamp()};lastNonce=data.nonce;/* 自分で送った分をonValue側で二重再生しないよう先に記録 */await set(ref(db,"fireworks/currentLaunch"),data);return data}
async function launchSelected(){if(!selected||launchLock)return;launchLock=true;document.getElementById("launchBtn").disabled=true;const item={...selected};const type=drawType();try{popup.classList.remove("show");await animateLaunch(item);const data=await sendLaunch(type,item);await push(ref(db,"fireworks/history"),{name:item.name||"名無し",message:item.message||"",color:item.color||"#ffd54f",type,launchedAt:serverTimestamp()});await remove(ref(db,`fireworks/entries/${item.id}`));selected=null;await playLaunch(data)}catch(e){console.error(e);setStatus("打ち上げ処理に失敗しました","error")}finally{setTimeout(()=>launchLock=false,600)}}
document.getElementById("launchBtn").onclick=launchSelected;
function animateLaunch(item){return new Promise(resolve=>{const el=document.getElementById("launchBall");el.style.background=`radial-gradient(circle at 35% 28%,#fff 0 5%,${item.color||'#ffd54f'} 22%,${item.color||'#ffd54f'} 58%,#34152c 100%)`;el.classList.remove("fly");void el.offsetWidth;el.classList.add("fly");setTimeout(()=>{document.getElementById("flash").classList.add("show");setTimeout(()=>document.getElementById("flash").classList.remove("show"),600);el.classList.remove("fly");resolve()},1280)})}
function showFallback(data,reason){document.getElementById("fallbackMain").textContent="🎆 花火を打ち上げ！";document.getElementById("fallbackSub").textContent=reason||`${safe(data.name||"名無し")} さん`;document.getElementById("fallback").classList.add("show");setTimeout(()=>document.getElementById("fallback").classList.remove("show"),3500)}
async function playLaunch(data){if(!/^[A-Za-z]$/.test(data?.type||""))return;if(playing){queued=data;return}playing=true;video.src=videoUrl(data.type);showStage(true);let finished=false;const finish=()=>{if(finished)return;finished=true;video.pause();video.removeAttribute("src");video.load();showStage(false);playing=false;setStatus("接続済み・待機中","ready");if(queued){const next=queued;queued=null;setTimeout(()=>playLaunch(next),300)}};video.onerror=()=>{setStatus("動画ファイルが見つかりません","error");showFallback(data,`読み込めません: ${decodeURI(videoUrl(data.type))}`);finish()};video.onended=finish;video.muted=false;try{await video.play();setStatus(`動画${data.type}を再生中`,"ready")}catch(e){
// 自動再生がブロックされた場合はミュートで再挑戦（OBSの音声設定で音が出ない環境の保険）
try{video.muted=true;await video.play();setStatus(`動画${data.type}をミュート再生中（自動再生制限）`,"error")}catch(e2){setStatus("動画を再生できません","error");showFallback(data,"OBSの自動再生・音声設定を確認してください");finish()}}}
onValue(ref(db,"fireworks/entries"),snap=>{const data=snap.val()||{};entries=Object.entries(data).map(([id,v])=>({id,...v})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));renderBalls();setStatus(`接続済み・花火玉 ${entries.length}個`,`ready`)},e=>{console.error(e);setStatus("Firebaseの読み込みに失敗","error")});
onValue(ref(db,"fireworks/currentLaunch"),snap=>{const data=snap.val();if(!initialized){initialized=true;lastNonce=data?.nonce||"";return}if(!data?.nonce||data.nonce===lastNonce)return;lastNonce=data.nonce;if(data.entryId&&selected?.id===data.entryId)popup.classList.remove("show");playLaunch(data)});
// 夜空に残すミニ花火の上限（古いものから消えます）
const MINI_LIMIT=45;
onValue(ref(db,"fireworks/history"),snap=>{const data=snap.val()||{};launched=Object.entries(data).map(([id,v])=>({id,...v})).sort((a,b)=>(a.launchedAt||0)-(b.launchedAt||0)).slice(-MINI_LIMIT);renderMinis()},e=>console.error(e));
onValue(ref(db,"fireworks/config/weights"),snap=>{const v=snap.val();if(v)weights={...weights,...v}},e=>console.error(e));
addEventListener("resize",()=>{renderBalls();renderMinis()});

// 起動時に動画フォルダを判定し、?debug=1 なら4本すべての有無を表示します
async function checkVideos(){const out=[];for(const k of TYPES){let ok=false;try{ok=(await fetch(videoUrl(k),{method:"HEAD",cache:"no-store"})).ok}catch(e){}out.push(k+(ok?"○":"×"))}
setStatus(`${VERSION} 動画[${decodeURI(videoBase)||"同じ階層"}] ${out.join(" ")}`,out.some(t=>t.includes("×"))?"error":"ready")}
resolveVideoBase().then(base=>{if(DEBUG){if(base===null)setStatus("動画フォルダが見つかりません（videos/ で試行します）","error");else checkVideos()}});
</script>
</body>
</html>
