<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みんなの花火大会</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px 60px;color:#fff;font-family:"Hiragino Sans","Yu Gothic",sans-serif;background:radial-gradient(circle at top,#263a70 0,#111b3b 42%,#050816 100%)}
.card{width:100%;max-width:430px;margin:auto;background:rgba(10,16,40,.74);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}h1{text-align:center;font-size:25px;margin:0 0 6px}.sub{text-align:center;font-size:13px;opacity:.72;margin-bottom:22px}label{display:block;margin:16px 0 7px;font-size:14px}input,textarea{width:100%;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(255,255,255,.1);color:#fff;padding:13px 14px;font-size:15px;outline:none}textarea{height:105px;resize:none;line-height:1.55}.count{text-align:right;font-size:11px;opacity:.65;margin-top:4px}.colors{display:flex;gap:9px;flex-wrap:wrap}.dot{width:46px;height:46px;border-radius:50%;border:3px solid transparent;cursor:pointer}.dot.selected{border-color:#fff;transform:scale(1.1)}button{width:100%;margin-top:25px;padding:15px;border:0;border-radius:999px;background:linear-gradient(135deg,#ffe06c,#ff8d57);color:#352000;font-size:16px;font-weight:700;cursor:pointer}.msg{text-align:center;min-height:20px;margin-top:13px;font-size:13px}.success{color:#9fffc0}.error{color:#ff9d9d}.note{margin-top:18px;font-size:12px;line-height:1.6;opacity:.7;text-align:center}
</style>
</head>
<body>
<div class="card">
<h1>🎆 みんなの花火大会</h1>
<div class="sub">願い・メッセージを花火にのせよう</div>
<label>お名前</label><input id="name" maxlength="20" placeholder="例：りんご太郎">
<label>花火にのせるメッセージ</label><textarea id="message" maxlength="60" placeholder="願いごとや一言を書いてね"></textarea>
<div class="count"><span id="charCount">0</span> / 60</div>
<label>花火玉の色</label><div class="colors" id="colors"></div>
<button id="submitBtn">花火玉を送る 🎇</button><div class="msg" id="msg"></div>
<div class="note">送信後、配信者が打ち上げると4種類の動画から抽選されます。</div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,push,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDKwFPNTgPJawD47WxuDsJH2-V1E3zWqoU",authDomain:"utaoshi-ringo.firebaseapp.com",databaseURL:"https://utaoshi-ringo-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"utaoshi-ringo",storageBucket:"utaoshi-ringo.firebasestorage.app",messagingSenderId:"572385012765",appId:"1:572385012765:web:2f5542f69930f1a714eaf4"};
const db=getDatabase(initializeApp(firebaseConfig));
const palette=["#ef5350","#ffca28","#66bb6a","#42a5f5","#ab47bc","#ff8a65"];let selected=palette[0];
const colors=document.getElementById("colors");palette.forEach((c,i)=>{const d=document.createElement("button");d.type="button";d.className="dot"+(i===0?" selected":"");d.style.background=c;d.ariaLabel=`色${i+1}`;d.onclick=()=>{selected=c;document.querySelectorAll(".dot").forEach(x=>x.classList.remove("selected"));d.classList.add("selected")};colors.appendChild(d)});
const message=document.getElementById("message");message.oninput=()=>document.getElementById("charCount").textContent=message.value.length;
document.getElementById("submitBtn").onclick=async()=>{const name=document.getElementById("name").value.trim();const text=message.value.trim();const msg=document.getElementById("msg");if(!name||!text){msg.className="msg error";msg.textContent="名前とメッセージを入力してね";return}const btn=document.getElementById("submitBtn");btn.disabled=true;try{await push(ref(db,"fireworks/entries"),{name,message:text,color:selected,createdAt:serverTimestamp()});message.value="";document.getElementById("charCount").textContent="0";msg.className="msg success";msg.textContent="花火玉を送りました！🎆"}catch(e){console.error(e);msg.className="msg error";msg.textContent="送信できませんでした"}finally{btn.disabled=false}};
</script>
</body></html>
